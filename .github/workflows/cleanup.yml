name: Cleanup old files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete old duplicate resources
        run: |
          R=app/src/main/res
          rm -f $R/drawable-xhdpi/tv_banner.xml
          rm -f $R/drawable/ic_launcher_foreground.xml
          rm -f $R/drawable/ic_launcher_dynamic_foreground.xml
          rm -f $R/drawable/ic_splash_logo.xml
          rm -f $R/drawable/ic_notification_logo.xml
          rm -f $R/drawable/ic_flow_logo.xml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove old duplicate resources" || echo "Nothing to commit"
          git push
