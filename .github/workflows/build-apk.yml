name: Unzip and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Unzip Flow-clean.zip
        run: unzip -q -o Flow-clean.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: project/Flow

      - name: Build debug APK
        working-directory: project/Flow
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.daemon.jvmargs="-Xmx4g" \
            -Dorg.gradle.workers.max=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flow-debug-apk
          path: project/Flow/app/build/outputs/apk/**/*.apk
