name: Unzip Flow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and move files to repo root
        run: |
          unzip -q -o Flow-clean.zip -d tmp_unzip
          cp -a tmp_unzip/Flow/. .
          rm -rf tmp_unzip Flow-clean.zip
          ls -la

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip Flow-clean.zip"
          git push
